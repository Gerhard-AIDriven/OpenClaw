<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Driven | Practical AI for real businesses</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #2D2D2D;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 680px;
    }

    .logo-icon {
      width: 90px;
      height: 90px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #007A4D 50%, #FFB81C 50%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
    }

    .brand-name {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }

    .brand-name span.ai {
      color: #FFB81C;
    }

    .brand-name span.driven {
      color: #FFFFFF;
    }

    .tagline {
      font-size: 1.1rem;
      color: #007A4D;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 2.5rem;
      text-transform: uppercase;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(to right, #007A4D, #FFB81C);
      margin: 0 auto 2.5rem;
      border-radius: 2px;
    }

    .under-construction {
      font-size: 1.4rem;
      font-weight: 600;
      color: #FFB81C;
      margin-bottom: 1rem;
    }

    .message {
      font-size: 1rem;
      color: #CCCCCC;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .contact {
      font-size: 0.95rem;
      color: #AAAAAA;
    }

    .contact a {
      color: #FFB81C;
      text-decoration: none;
      font-weight: 500;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #555555;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="logo-icon">🧠</div>

    <div class="brand-name">
      <span class="ai">AI</span> <span class="driven">Driven</span>
    </div>

    <div class="tagline">Practical AI for real businesses</div>

    <div class="divider"></div>

    <div class="under-construction">🚧 Something great is coming</div>

    <div class="message">
      We're putting the finishing touches on our website.<br />
      Check back soon — we won't be long.
    </div>

    <div class="contact">
      In the meantime, reach us at
      <a href="mailto:gerhard@aidriven.biz">gerhard@aidriven.biz</a>
    </div>

    <div class="footer">© 2026 AI Driven. All rights reserved.</div>

  </div>
</body>
</html>
